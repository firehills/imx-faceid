[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "imx-faceid"
version = "0.1.0"
description = "NATS and Qdrant face identification service"
readme = "README.md"
requires-python = ">=3.12.3"
dependencies = [
    "flatbuffers>=25.2.10",
    "nats-py>=2.10",
    "numpy>=2.2",
    "Pillow>=11.1",
    "qdrant-client>=1.14",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
onnx = ["onnxruntime>=1.21"]
litert = ["ai-edge-litert>=2.1"]
test = ["pytest>=8.3"]

[project.scripts]
imx-faceid = "imx_faceid.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
